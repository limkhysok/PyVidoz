[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvidoz"
version = "0.1.0"
description = "Batch video formatter/upscaler for downloaded social-media clips"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6==6.9.2",
]

[tool.setuptools]
py-modules = ["gui_app", "format_videos", "analyze_videos"]
